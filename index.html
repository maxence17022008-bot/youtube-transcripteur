<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Transcripteur</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f6fa;color:#1d2433}.wrap{max-width:780px;margin:8vh auto;padding:24px}.panel{background:white;padding:36px;border-radius:22px;box-shadow:0 12px 50px #1a254012}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.05em;margin:0 0 10px}.sub{color:#677185;margin-bottom:30px}label{display:block;font-weight:650;margin-bottom:10px}input,textarea{box-sizing:border-box;width:100%;border:1px solid #d6dce7;border-radius:12px;padding:15px;font:inherit}input:focus,textarea:focus{outline:2px solid #ef4444}button{border:0;background:#ef4444;color:white;font:inherit;font-weight:700;border-radius:12px;padding:14px 22px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.main{width:100%;margin-top:14px}textarea{height:350px;resize:vertical;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.secondary{background:#1d2433}.message{margin:16px 0;min-height:20px}.error{color:#b91c1c}.success{color:#15803d}.result{margin-top:28px}.note{font-size:13px;color:#7b8495;margin-top:25px}@media(max-width:600px){.wrap{margin:15px auto;padding:12px}.panel{padding:22px}}</style></head><body><main class="wrap"><section class="panel"><h1>🎬 YouTube Transcripteur</h1><p class="sub">Collez un lien YouTube pour récupérer les sous-titres accessibles, gratuitement.</p><form id="form"><label for="url">Lien de la vidéo</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required><button id="submit" class="main">✨ Transcrire la vidéo</button></form><div id="message" class="message" role="status" aria-live="polite"></div><div id="result" class="result" hidden><h2>Votre transcription</h2><p id="meta" class="sub"></p><textarea id="text" aria-label="Transcription"></textarea><div class="actions"><button id="copy" class="secondary">Copier le texte</button><button id="download">⬇ Télécharger .txt</button></div></div><p class="note">Fonctionne uniquement lorsque YouTube rend les sous-titres accessibles. Certaines vidéos et certains hébergements peuvent être bloqués.</p></section></main><script>const form=document.getElementById('form'),msg=document.getElementById('message'),result=document.getElementById('result'),btn=document.getElementById('submit'),area=document.getElementById('text');let currentId='';form.addEventListener('submit',async e=>{e.preventDefault();result.hidden=true;btn.disabled=true;btn.textContent='Transcription en cours…';msg.className='message';msg.textContent='Récupération des sous-titres…';try{const response=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.getElementById('url').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Une erreur est survenue.');area.value=data.text;currentId=data.videoId;document.getElementById('meta').textContent='Langue : '+data.language+' · '+data.text.trim().split(/\s+/).length+' mots';result.hidden=false;msg.textContent='Transcription récupérée !';msg.className='message success'}catch(err){msg.textContent=err.message;msg.className='message error'}finally{btn.disabled=false;btn.textContent='✨ Transcrire la vidéo'}});document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(area.value);msg.textContent='Texte copié !';msg.className='message success'}catch{area.select();msg.textContent='Sélectionnez et copiez le texte.'}};document.getElementById('download').onclick=()=>{const blob=new Blob([area.value],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='transcription_'+currentId+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></body></html>
